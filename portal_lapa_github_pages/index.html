<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Portal Médico | Metropolitano Lapa</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Arial;background:#edf3f9;color:#18344f;min-height:100vh;display:grid;place-items:center;padding:20px}.card{background:white;max-width:440px;width:100%;padding:32px;border-radius:20px;box-shadow:0 14px 38px #18344f18}.brand{color:#1458a2;font-weight:800;font-size:24px;text-align:center}.sub{text-align:center;font-size:12px;letter-spacing:2px;color:#66809a;margin-top:5px}h1{font-size:22px;text-align:center;margin:35px 0 8px}p{color:#62768a;text-align:center;line-height:1.5}label{display:block;font-weight:650;margin:28px 0 9px}input{width:100%;padding:15px;border:1px solid #b9c8d6;border-radius:10px;font-size:18px}button{width:100%;border:0;border-radius:10px;padding:15px;background:#1458a2;color:white;font-size:16px;font-weight:700;margin-top:18px;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.result{margin-top:20px;background:#f0f5fb;border-radius:10px;padding:16px}.result strong{display:block;margin-bottom:7px}.result p{text-align:left;font-size:14px;margin:4px 0}footer{text-align:center;color:#8293a4;font-size:12px;margin-top:25px}.tag{background:#fff4d9;color:#795600;border-radius:8px;padding:9px;text-align:center;font-size:13px;margin-top:18px}</style></head><body><main class="card"><div class="brand">✚ Metropolitano Lapa</div><div class="sub">PORTAL DE ACESSO MÉDICO</div><div class="tag">Ambiente de demonstração — sem dados reais</div><h1>Consulta de credenciais</h1><p>Digite um CPF fictício com 11 dígitos para testar a interface.</p><form id="form"><label for="cpf">CPF do médico</label><input id="cpf" placeholder="000.000.000-00" inputmode="numeric" autocomplete="off" maxlength="14" required><button id="btn" disabled>Consultar demonstração</button></form><div id="result" aria-live="polite"></div><footer>Protótipo de interface • Não utiliza dados pessoais</footer></main><script>const input=document.getElementById('cpf'),btn=document.getElementById('btn'),result=document.getElementById('result');input.addEventListener('input',()=>{let v=input.value.replace(/\D/g,'').slice(0,11);input.value=v.replace(/^(\d{3})(\d)/,'$1.$2').replace(/^(\d{3})\.(\d{3})(\d)/,'$1.$2.$3').replace(/\.(\d{3})(\d)/,'.$1-$2');btn.disabled=v.length!==11;result.textContent=''});document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();if(input.value.replace(/\D/g,'').length!==11)return;result.innerHTML='<div class="result"><strong>✓ Consulta demonstrativa</strong><p>Login fictício: <b>medico.exemplo</b></p><p>Senha: protegida — não exibida nesta demonstração.</p><p>Nenhum dado foi enviado ou consultado.</p></div>'});</script></body></html>
