<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portal Médicos Lapa — Laboratório</title><style>body{font:16px system-ui;background:#eef3fa;margin:0;display:grid;place-items:center;min-height:100vh;color:#17345d}.card{background:white;padding:30px;border-radius:18px;box-shadow:0 8px 30px #17345d18;max-width:430px;width:calc(100% - 60px)}h1{font-size:23px}label{display:block;margin:20px 0 8px}input,button{box-sizing:border-box;width:100%;padding:13px;font-size:16px;border-radius:9px}input{border:1px solid #b6c5d9}button{margin-top:20px;background:#1458a2;color:white;border:0;cursor:pointer}.small{color:#63748c;font-size:13px}pre{white-space:pre-wrap;background:#eef3fa;padding:15px;border-radius:8px}</style></head><body><main class="card"><h1>Hospital Metropolitano Lapa</h1><h2 style="font-size:18px">Consultar credencial de acesso ao laboratório</h2><p class="small">Ambiente de demonstração: não utiliza senhas reais.</p><form id="form"><label for="cpf">CPF</label><input id="cpf" inputmode="numeric" maxlength="14" autocomplete="off" placeholder="000.000.000-00" required><button>Consultar (demonstração)</button></form><pre id="result" hidden></pre><p class="small">A consulta real será ativada somente após autenticação individual.</p></main><script>const API='COLE_AQUI_URL_DO_WORKER';document.querySelector('#form').addEventListener('submit',async e=>{e.preventDefault();const out=document.querySelector('#result');out.hidden=false;out.textContent='Consultando...';const cpf=document.querySelector('#cpf').value.replace(/\D/g,'');if(cpf.length!==11){out.textContent='Informe 11 dígitos.';return}if(API.includes('COLE_AQUI')){out.textContent='Configure o endereço do Worker no arquivo index.html.';return}try{const r=await fetch(API.replace(/\/$/,'')+'/demo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cpf})});const d=await r.json();out.textContent=r.ok?`Login: ${d.login}\nSenha: ${d.senha}\n${d.aviso}`:(d.error||'Erro na consulta')}catch{out.textContent='Falha de comunicação com o Worker.'}})</script></body></html>
